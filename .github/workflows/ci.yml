name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests

      # 静态类型检查：抓"类型不匹配 / Optional 未处理 / 变量承担两种类型"这类
      # 编译器在 Java 里会拦、而 Python 运行时不管的问题。
      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest
