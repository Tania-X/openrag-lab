openapi: 3.0.3
info:
  title: OpenRAG Lab API
  version: 0.1.0
  description: OpenRAG Lab 自研前后端契约。FastAPI 后端暴露给 React 前端的接口。
servers:
  - url: http://localhost:8000
    description: Local development

paths:
  /api/health:
    get:
      summary: Health check
      operationId: health
      tags:
        - system
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/search:
    post:
      summary: Search knowledge base through OpenRAG
      operationId: search
      tags:
        - search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "502":
          description: OpenRAG upstream error

  /api/chat:
    post:
      summary: Chat with OpenRAG
      operationId: chat
      tags:
        - chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Chat response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "502":
          description: OpenRAG upstream error

  /api/documents:
    get:
      summary: List ingested documents
      operationId: listDocuments
      tags:
        - documents
      responses:
        "200":
          description: Document list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"
        "502":
          description: OpenRAG upstream error

components:
  schemas:
    SearchRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          example: 支付网关读超时
        limit:
          type: integer
          default: 10
        score_threshold:
          type: number
          default: 0
        rerank:
          type: boolean
          default: false
        rerank_model:
          type: string
          nullable: true
          example: BAAI/bge-reranker-v2-m3
        rerank_top_n:
          type: integer
          nullable: true
        filters:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            data_sources:
              - "40-2024-支付超时处理规范.md"

    SearchResult:
      type: object
      properties:
        filename:
          type: string
        text:
          type: string
        score:
          type: number
        page:
          type: integer
          nullable: true
        mimetype:
          type: string
          nullable: true

    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        aggregations:
          type: object
        total:
          type: integer

    ChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: 2024 年支付网关读超时是多少？
        limit:
          type: integer
          default: 10
        score_threshold:
          type: number
          default: 0
        filters:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    ChatResponse:
      type: object
      properties:
        response:
          type: string
        chat_id:
          type: string
          nullable: true
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"

    FileRecord:
      type: object
      properties:
        filename:
          type: string
        document_id:
          type: string
        mimetype:
          type: string
        chunk_count:
          type: integer
        embedding_model:
          type: string

    DocumentListResponse:
      type: object
      properties:
        total:
          type: integer
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileRecord"
