info:
  title: OpenRAG Lab API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/auth/login:
    post:
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Login
      tags:
      - auth
  /api/auth/me:
    get:
      operationId: me_api_auth_me_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Me
      tags:
      - auth
  /api/auth/register:
    post:
      operationId: register_api_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Register
      tags:
      - auth
  /api/chat:
    post:
      description: Answer using the documents owned by the caller's tenant.
      operationId: chat_api_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Chat
      tags:
      - chat
  /api/documents:
    get:
      description: List the documents the caller's tenant has registered.
      operationId: list_documents_api_documents_get
      parameters:
      - in: query
        name: tenant_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List Documents
      tags:
      - documents
  /api/documents/ingest:
    post:
      description: 'Store an uploaded file in OpenRAG under the tenant''s namespace.


        The document is registered only after OpenRAG reports the ingestion task

        finished, so a failed ingest leaves no registry entry behind.'
      operationId: ingest_document_api_documents_ingest_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_ingest_document_api_documents_ingest_post'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Ingest Document
      tags:
      - documents
  /api/documents/{filename}:
    delete:
      description: Delete a registered document by its display name.
      operationId: delete_document_api_documents__filename__delete
      parameters:
      - in: path
        name: filename
        required: true
        schema:
          title: Filename
          type: string
      - in: query
        name: tenant_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteDocumentOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Delete Document
      tags:
      - documents
  /api/health:
    get:
      operationId: health_api_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Health Api Health Get
                type: object
          description: Successful Response
      summary: Health
      tags:
      - system
  /api/permissions:
    get:
      operationId: list_permissions_api_permissions_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PermissionOut'
                title: Response List Permissions Api Permissions Get
                type: array
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: List Permissions
      tags:
      - roles
  /api/roles:
    get:
      operationId: list_roles_api_roles_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RoleOut'
                title: Response List Roles Api Roles Get
                type: array
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: List Roles
      tags:
      - roles
  /api/search:
    post:
      description: 'Search the documents owned by the caller''s tenant.


        The tenant boundary comes from the document registry, never from the body.'
      operationId: search_api_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Search
      tags:
      - search
  /api/tenants/me:
    get:
      operationId: get_my_tenant_api_tenants_me_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Get My Tenant
      tags:
      - tenants
  /api/users:
    get:
      operationId: list_users_api_users_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserResponse'
                title: Response List Users Api Users Get
                type: array
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: List Users
      tags:
      - users
    post:
      operationId: create_user_api_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Create User
      tags:
      - users
