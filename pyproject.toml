[project]
name = "openrag-lab"
version = "0.1.0"
description = "OpenRAG-based financial knowledge base: ingestion, metadata, evaluation, and Dify migration utilities."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20",
    "pyjwt>=2.8",
    "rich>=13.7",
    "sqlalchemy[asyncio]>=2.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
openrag-lab = "openrag_lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openrag_lab"]

[tool.mypy]
# 起步策略：默认检查 + 几个高价值严格项，而不是一次 --strict 铺开。
# 实测基线（2026-09-12）：src+tests 下这套配置 0 错误；--strict 仍有约 38 条，
# 后续可以按模块逐步收紧（domain/application 先严、infrastructure/legacy 后严）。
python_version = "3.12"
files = ["src", "tests"]
check_untyped_defs = true        # 也检查没写类型标注的函数体
warn_unused_ignores = true       # 过期的 # type: ignore 要清掉
warn_redundant_casts = true
no_implicit_optional = true      # = None 不再隐式当成 Optional
strict_equality = true           # 类型不相交的比较直接报错
show_error_codes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
